{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<section class="portada">
  <h1>{{ titulo }}</h1>
  <p class="portada-texto">{{ mensaje }}</p>
  {% if detalle %}
  <pre class="detalle-error">{{ detalle }}</pre>
  {% endif %}
  <a href="/" class="boton">Volver al inicio</a>
</section>
{% endblock %}

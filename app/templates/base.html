<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ nombre_app }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  <header class="cabecera">
    <a href="/" class="marca">
      <span class="marca-icono">&#9906;</span>
      <span>
        <strong>{{ nombre_app }}</strong>
        <small>Sistema experto de investigacion</small>
      </span>
    </a>
    <nav class="nav-superior">
      {% block nav %}{% endblock %}
      <a href="/admin" class="boton boton-suave">Administracion</a>
    </nav>
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    <span>{{ nombre_app }} v{{ version_app }}</span>
    <span>Motor de inferencia: SWI-Prolog &middot; Interfaz: Python / FastAPI</span>
  </footer>
</body>
</html>
